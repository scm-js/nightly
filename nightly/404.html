      What a search result or a pasted link shows for the editor itself. A shared map's link

    <!--
      The splash before the splash. This paints as soon as the HTML is parsed — before the
      stylesheet arrives, before the ~1 MB module bundle evaluates, before React mounts — and
      that is what decides how soon the desktop window appears at all: `desktop/main.ts` keeps
      it hidden until the renderer's first paint, so without this the whole launch is a blank
      screen until React's first commit.

      It is deliberately self-contained: its own class names and every value inline, so it
      owes nothing to `styles/splash.css` (which in `npm run dev` does not exist until the
      bundle runs, and would leave this as unstyled text). The values are copied from there —
      it is the splash card in its initial state, before the canvas has drawn a frame — so
      change both together or the handover stops being invisible. `SplashScreen` drops this
      node in a layout effect the moment it has mounted (`splash/bootSplash.ts`).
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #12151b; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 300;
        /* base.css's own resets and body type, spelled out: without them the title and
           subtitle inherit the UA's serif, the card measures content-box and the footer
           lines sit on a different leading, so the handover is a visible jump. */
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.35;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
        display: grid;
        place-items: center;
        background: rgb(6, 4, 14);
      }
      #boot-splash, #boot-splash *, #boot-splash *::before, #boot-splash *::after {
        box-sizing: border-box;
      }
      #boot-splash .card {
        position: relative;
        width: min(520px, 90vmin);
        aspect-ratio: 4 / 5;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(ellipse at 50% 25%, rgba(255, 95, 162, 0.06), transparent 60%),
          radial-gradient(ellipse at 80% 90%, rgba(160, 100, 240, 0.04), transparent 55%),
          linear-gradient(180deg, #120818, #08040e);
        border: 1px solid rgba(255, 95, 162, 0.15);
        border-radius: 8px;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.9),
          inset 0 0 0 1px rgba(255, 95, 162, 0.08),
          0 30px 100px rgba(0, 0, 0, 0.85),
          0 0 80px rgba(255, 95, 162, 0.06);
        overflow: hidden;
      }
      #boot-splash .center {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 16px;
        text-align: center;
      }
      #boot-splash h1 {
        margin: 0;
        font-size: clamp(40px, 10vmin, 56px);
        font-weight: 800;
        letter-spacing: 0.18em;
        padding-left: 0.18em;
        line-height: 1;
        color: #ff5fa2;
        text-shadow:
          0 0 30px rgba(255, 95, 162, 0.5),
          0 0 80px rgba(255, 95, 162, 0.15),
          0 2px 0 rgba(0, 0, 0, 0.7);
      }
      #boot-splash h1 span { color: #dde2ea; }
      #boot-splash .sub {
        margin-top: 10px;
        font-size: 11px;
        letter-spacing: 0.35em;
        padding-left: 0.35em;
        text-transform: uppercase;
        color: #a064f0;
        text-shadow: 0 0 20px rgba(160, 100, 240, 0.4);
      }
      #boot-splash .bottom {
        position: relative;
        padding: 0 28px 22px;
        background: linear-gradient(180deg, transparent, rgba(8, 4, 14, 0.85) 20%, rgba(8, 4, 14, 0.95));
        font-family: "Cascadia Mono", "JetBrains Mono", ui-monospace, Consolas, Menlo, monospace;
        font-size: 10.5px;
        color: #99a2b3;
      }
      #boot-splash .log {
        height: 64px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
      }
      #boot-splash .log div {
        line-height: 1.45;
        font-size: 10px;
        color: #ffbedc;
      }
      #boot-splash .log div::after {
        content: "▍";
        color: #ff5fa2;
        padding-left: 0.4em;
        animation: boot-blink 1s step-end infinite;
      }
      @keyframes boot-blink { 0% { opacity: 1 } 50% { opacity: 0 } }
      #boot-splash .bar {
        margin-top: 10px;
        height: 2px;
        background: rgba(255, 95, 162, 0.1);
        border-radius: 1px;
      }
      #boot-splash .foot {
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
      }
      #boot-splash .foot .version { letter-spacing: 0.12em; color: #b43c6e; }
      #boot-splash .foot .author { letter-spacing: 0.08em; color: #5d6675; }
      #boot-splash .skip {
        margin-top: 6px;
        text-align: center;
        font-size: 9px;
        letter-spacing: 0.1em;
        color: #5d6675;
        opacity: 0.6;
      }
    </style>
    <!--
      Cloudflare Web Analytics: visits and referrers, no cookies. Only on the hosted
      sites — the same bundle is the release zip, the container image and the desktop app
      (served from `scmjs://`), and none of those may report, so the switch is the
      hostname rather than a build flag. A fork on its own domain matches nothing either.
    -->
    <script>
      (function () {
        var token = {
          // The site's own token: the editor is a path of it (scmjs.dev/editor/).
          "scmjs.dev": "4f6f300eb17c49e8b16331e1e96f6b2a",
          // The address the editor had, for as long as it still serves it.
          "editor.scmjs.dev": "84b275d150b84a8294f735b811518112",
          "nightly.editor.scmjs.dev": "3411da8934ed49829502fc55b16ff84b",
        }[location.hostname];
        if (!token) return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = "https://static.cloudflareinsights.com/beacon.min.js";
        s.setAttribute("data-cf-beacon", JSON.stringify({ token: token }));
        document.head.appendChild(s);
      })();
    </script>
    <!--
      Our own visit count: the script at /_e.js and the address it sends to are the
      front-door worker's (scm-js/cloudflare-link-previews), and the numbers are on the
      scmjs.dev server's /admin page. No cookies and no identifier; the site's privacy page
      says what is sent. Only on the hosted editor, for the same reason as above (the script
      checks the host again itself).
    -->
    <script>
      (function () {
        if (location.hostname !== "scmjs.dev") return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = "/_e.js";
        document.head.appendChild(s);
      })();
    </script>
